[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Pre-Market Research & Trade Planning Agent"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
trading-agent = "trading_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]