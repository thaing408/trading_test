[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-test"
version = "0.1.0"
description = "Methods lab: multi-method scanners (no CIO desk). Sister of trading_agent."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]
desk-ui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.scripts]
trading-agent = "trading_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_agent*"]

[tool.setuptools.package-data]
trading_agent = [
    "desk_ui/templates/*.html",
    "desk_ui/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
